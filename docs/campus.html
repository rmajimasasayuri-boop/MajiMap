<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>屋外・7号館・駐車場｜Maji Map</title><style>
*{box-sizing:border-box}body{margin:0;font:15px sans-serif;color:#244954;background:#f5f7f5}header{padding:12px;display:flex;gap:12px;align-items:center;background:white}h1{font-size:18px;margin:0;flex:1}button,a{color:#176f68}button{border:1px solid #cbdde2;background:white;border-radius:18px;min-height:38px;padding:8px 12px;font:inherit}nav{display:flex;gap:6px;padding:8px;overflow:auto;background:white}nav button{white-space:nowrap}button[aria-pressed=true]{background:#176f68;color:white}#viewport{height:calc(100dvh - 230px);min-height:230px;overflow:hidden;touch-action:none;position:relative}#plan{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}#pin{position:absolute;pointer-events:none;width:26px;height:26px;border:4px solid white;border-radius:50%;background:#dc3545;box-shadow:0 1px 5px #3458;display:none}footer{padding:12px;background:white;position:relative;z-index:1}#name{font-size:18px}#detail{margin:6px 0;line-height:1.5}small{display:block;color:#607780;font-size:12px;line-height:1.5}.tools{position:absolute;right:8px;bottom:8px;display:flex;gap:5px;z-index:2}
</style><header><h1>屋外・7号館・駐車場</h1><a href="./" target="_top">院内マップへ</a></header><nav aria-label="屋外の施設"><button data-id="seven">7号館</button><button data-id="parking">患者駐車場</button><button data-id="walk">構内通路</button></nav><div id="viewport"><img id="plan" src="assets/campus-context.svg?v=20261102h" alt="病院と7号館、駐車場と構内通路の配置図"><i id="pin"></i><div class="tools"><button id="plus" aria-label="屋外図を拡大">＋</button><button id="minus" aria-label="屋外図を縮小">−</button><button id="reset">全体</button></div></div><footer><strong id="name">施設を選択してください</strong><p id="detail">地図を指で移動・ピンチで拡大できます。灰色の線は構内の通路位置を示します。</p><a href="./?goal=outpatient%3A3%3A%3Abuilding7Entrance" target="_top">院内マップから7号館入口へ</a><small>Yahoo!マップ・Googleマップ（航空写真）・公式完成後写真を参考にした配置図。縮尺は概略です。7号館入口は院内3階の地図からナビできます。館内の階・扉・段差と駐車場への経路は未照合です。</small><small><a href="https://map.yahoo.co.jp/search?q=近畿大学病院" target="_blank" rel="noopener">Yahoo!マップ</a> · <a href="https://www.google.com/maps/@34.49909,135.51683,18z/data=!3m1!1e3" target="_blank" rel="noopener">Google航空写真</a> · <a href="https://www.med.kindai.ac.jp/parking_price.html" target="_blank" rel="noopener">公式駐車場案内</a> · <a href="https://www.med.kindai.ac.jp/floormap_facility.html" target="_blank" rel="noopener">公式施設案内</a></small></footer><script>
const places={seven:{p:[785,1300],name:'7号館（管理棟）',detail:'2階：外来食堂 ffields。3階：CAFE CORE・店舗。院内マップ3階から入口までナビ可能。館内の階・段差は未照合です。'},parking:{p:[2065,1330],name:'患者駐車場',detail:'患者さま用駐車場。歩行経路は現地の案内に従ってください。'},walk:{p:[850,960],name:'病院南側の2本の構内通路',detail:'1・2号館の南側から7号館・駐車場周辺への通路位置を追加しました。利用者確認に基づき7号館入口まで接続。線の位置と距離は概略です。'}};
let scale=1,pan=[0,0],selected=null,points=new Map(),gesture=null;const view=document.getElementById('viewport'),plan=document.getElementById('plan'),pin=document.getElementById('pin');function paint(){plan.style.transform=`translate(${pan[0]}px,${pan[1]}px) scale(${scale})`;if(selected){const r=view.getBoundingClientRect(),fit=Math.min(r.width/2500,r.height/1600),p=places[selected].p;pin.style.display='block';pin.style.left=(r.width/2+pan[0]+(p[0]-1250)*fit*scale-13)+'px';pin.style.top=(r.height/2+pan[1]+(p[1]-800)*fit*scale-13)+'px';}}
function select(id){selected=id;document.getElementById('name').textContent=places[id].name;document.getElementById('detail').textContent=places[id].detail;document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));paint();}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id));document.getElementById('plus').onclick=()=>{scale=Math.min(4,scale*1.3);paint()};document.getElementById('minus').onclick=()=>{scale=Math.max(.7,scale/1.3);paint()};document.getElementById('reset').onclick=()=>{scale=1;pan=[0,0];paint()};function basis(){const ps=[...points.values()];return ps.length>1?{center:[(ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2],distance:Math.hypot(ps[1][0]-ps[0][0],ps[1][1]-ps[0][1]),scale,pan:[...pan]}:{center:ps[0],pan:[...pan],scale};}view.onpointerdown=e=>{if(e.target.closest('button'))return;view.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);gesture=basis();gesture.moved=false};view.onpointermove=e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,[e.clientX,e.clientY]);const ps=[...points.values()],c=ps.length>1?[(ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2]:ps[0];if(Math.hypot(c[0]-gesture.center[0],c[1]-gesture.center[1])>4)gesture.moved=true;pan=[gesture.pan[0]+c[0]-gesture.center[0],gesture.pan[1]+c[1]-gesture.center[1]];if(ps.length>1)scale=Math.max(.7,Math.min(4,gesture.scale*Math.hypot(ps[1][0]-ps[0][0],ps[1][1]-ps[0][1])/gesture.distance));paint();};view.onpointerup=e=>{if(!points.has(e.pointerId))return;if(!gesture.moved&&points.size===1){const r=view.getBoundingClientRect(),fit=Math.min(r.width/2500,r.height/1600)*scale,p=[1250+(e.clientX-r.left-r.width/2-pan[0])/fit,800+(e.clientY-r.top-r.height/2-pan[1])/fit];const id=Object.keys(places).sort((a,b)=>Math.hypot(p[0]-places[a].p[0],p[1]-places[a].p[1])-Math.hypot(p[0]-places[b].p[0],p[1]-places[b].p[1]))[0];select(id);}points.delete(e.pointerId);gesture=points.size?basis():null;};view.onpointercancel=e=>{points.delete(e.pointerId);gesture=points.size?basis():null};window.onresize=paint;
</script></html>
