<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現在のマップで通路を修正 | Maji Map</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#264d59;font:14px/1.6 sans-serif}header{padding:14px 22px;background:white;border-bottom:1px solid #d8e5e7;display:flex;justify-content:space-between;gap:20px}a{color:#24665e}p{margin:6px 22px}iframe{display:block;width:100%;height:calc(100vh - 112px);border:0;min-height:700px}</style></head><body><header><strong>Maji Map · 現在のマップで通路を修正</strong><a href="review.html">確認・コメントの画面に戻る ↗</a></header><p>案内と同じ図面に描きます。修正案と確認メモは、このブラウザ内に保存されます。</p><iframe id="annotationMap" title="現在の案内マップの通路編集" src="./?review=1&amp;annotate=1&amp;floor=3"></iframe><script>const q=new URLSearchParams(location.search),u=new URL('./',location.href);u.searchParams.set('review','1');u.searchParams.set('annotate','1');u.searchParams.set('floor',q.get('floor')||'3');if(q.get('goal'))u.searchParams.set('goal',q.get('goal'));const frame=document.getElementById('annotationMap');frame.src=u.href;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='maji-map-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(720,Math.min(1700,e.data.height))+'px';});</script></body></html>
